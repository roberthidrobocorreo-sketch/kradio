<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-POP Pulse Radio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>

    <main class="player-card">
        <header class="radio-header">
            <span class="live-badge"><span class="dot"></span> EN VIVO</span>
            <h1 class="logo">K-POP<span>PULSE</span></h1>
        </header>

        <section class="album-art-container">
            <div class="album-art">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=600&auto=format&fit=crop" alt="K-Pop Radio Live Cover" id="cover">
                <div class="equalizer-overlay">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </section>

        <section class="track-info">
            <h2 id="song-title">Top Hits 24/7</h2>
            <p id="artist-name">Red Velvet, TWICE, aespa & More</p>
        </section>

        <section class="audio-controls">
            <!-- Enlace directo de Icecast con la extensión .mp3 -->
            <audio id="audio-player" src="https://radios.yanapak.org/kradio.mp3"></audio>
            
            <button id="play-btn" class="control-btn play-btn" aria-label="Reproducir">
                <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <div class="volume-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="vol-icon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </section>

        <footer class="radio-footer">
            <p> Transmitiendo lo mejor de la música K-Pop</p>
        </footer>
    </main>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const playerCard = document.querySelector('.player-card');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    playerCard.classList.add('playing');
                }).catch(e => {
                    console.log("Reproducción pausada por política del navegador:", e);
                });
            } else {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                playerCard.classList.remove('playing');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
