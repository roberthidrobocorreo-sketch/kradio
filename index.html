<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-POP Pulse Radio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>

    <main class="player-card">
        <header class="radio-header">
            <span class="live-badge"><span class="dot"></span> EN VIVO</span>
            <h1 class="logo">K-POP<span>PULSE</span></h1>
        </header>

        <section class="album-art-container">
            <div class="album-art">
                <!-- La imagen se actualizará dinámicamente con la API -->
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=600&auto=format&fit=crop" alt="K-Pop Radio Live Cover" id="cover">
                <div class="equalizer-overlay">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </section>

        <section class="track-info">
            <h2 id="song-title">Cargando canción...</h2>
            <p id="artist-name">K-POP PULSE RADIO</p>
        </section>

        <section class="audio-controls">
            <audio id="audio-player" src="https://radios.yanapak.org/kradio" preload="auto"></audio>
            
            <button id="play-btn" class="control-btn play-btn" aria-label="Reproducir">
                <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <div class="volume-container">
                <svg viewBox="0 0 24 24" fill="currentColor" class="vol-icon">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </section>

        <footer class="radio-footer">
            <p> Transmitiendo lo mejor de la música K-Pop</p>
        </footer>
    </main>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const playerCard = document.querySelector('.player-card');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const coverImg = document.getElementById('cover');

        let lastTrackText = "";

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    playerCard.classList.add('playing');
                }).catch(err => {
                    console.error("Error en reproducción:", err);
                });
            } else {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                playerCard.classList.remove('playing');
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Función para buscar la carátula usando la API pública de iTunes
        function fetchAlbumArt(searchTerm) {
            fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchTerm)}&entity=song&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        let artworkUrl = data.results[0].artworkUrl100;
                        // Cambiamos la resolución de 100x100 a 600x600 para que se vea nítida en alta calidad
                        artworkUrl = artworkUrl.replace('100x100bb.jpg', '600x600bb.jpg');
                        coverImg.src = artworkUrl;
                    }
                })
                .catch(err => {
                    console.log("No se pudo obtener la carátula de la API.");
                });
        }

        // Consultar metadatos de Icecast
        function updateMetadata() {
            fetch('https://radios.yanapak.org/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    if (data && data.icestats) {
                        let sources = data.icestats.source;
                        if (!Array.isArray(sources)) {
                            sources = [sources];
                        }
                        const currentStream = sources.find(s => s.listenurl && s.listenurl.includes('kradio'));
                        
                        if (currentStream && currentStream.title) {
                            let rawTitle = currentStream.title;
                            
                            // Solo actualizamos y buscamos si la canción cambió
                            if (rawTitle !== lastTrackText) {
                                lastTrackText = rawTitle;
                                const parts = rawTitle.split('-');
                                
                                let artist = "";
                                let song = "";

                                if (parts.length > 1) {
                                    artist = parts[0].trim();
                                    song = parts.slice(1).join('-').trim();
                                    artistName.textContent = artist;
                                    songTitle.textContent = song;
                                } else {
                                    song = rawTitle;
                                    songTitle.textContent = song;
                                    artistName.textContent = "K-POP PULSE RADIO";
                                }

                                // Llamamos a la API con el artista y la canción para obtener la carátula
                                fetchAlbumArt(`${artist} ${song}`);
                            }
                        } else {
                            songTitle.textContent = "Top Hits 24/7";
                            artistName.textContent = "Red Velvet, TWICE, aespa & More";
                        }
                    }
                })
                .catch(err => {
                    console.log("Error consultando metadatos.");
                });
        }

        updateMetadata();
        setInterval(updateMetadata, 10000);
    </script>
</body>
</html>
